<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Mandyyy</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #ff4d6d; --cream: #fff5f5; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: var(--cream); font-family: 'Quicksand', sans-serif; 
            height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
            overflow: hidden; touch-action: manipulation;
        }

        .floating-heart {
            position: absolute; color: var(--pink); pointer-events: none;
            animation: floatUp 1.5s ease-out forwards; z-index: 999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); padding: 50px 30px; border-radius: 30px; 
            box-shadow: 0 8px 32px 0 rgba(255, 77, 109, 0.2); border: 1px solid rgba(255, 255, 255, 0.2);
            width: 90%; max-width: 400px; animation: fadeIn 1.5s ease;
        }

        .elegant-title { 
            font-family: 'Dancing Script', cursive; font-size: 3.5rem; 
            background: linear-gradient(45deg, #ff4d6d, #ff8fa3); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; 
        }

        .enter-btn { 
            background: var(--pink); color: white; border: none; padding: 15px 40px; 
            border-radius: 50px; font-size: 1.2rem; margin-top: 30px; cursor: pointer; 
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3); font-family: 'Quicksand', sans-serif;
            transition: 0.3s;
        }
        .enter-btn:active { transform: scale(0.95); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onclick="spawnHeart(event)">

    <div class="glass-card">
        <h1 class="elegant-title">Hello, My Loveeeeee</h1>
        <p style="color: #666; font-size: 1.1rem; margin-top: 15px; line-height: 1.5;">
            Welcome to a little corner of the internet made just for you.
        </p>
        
        <button class="enter-btn" onclick="window.location.href='hub.html'">Enter Here</button>
    </div>

    <script>
        function spawnHeart(e) {
            if (e.target.tagName === 'BUTTON') return;
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'floating-heart';
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            heart.style.left = (x - 10) + 'px';
            heart.style.top = (y - 10) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
        }
    </script>
</body>
</html>
