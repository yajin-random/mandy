<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Mandyyy</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #ed6e8b; --cream: #fffafa; --ink: #412d46; --lilac: #9582b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; background: radial-gradient(circle at 18% 20%, #ffe3ea 0, transparent 30%), radial-gradient(circle at 80% 85%, #eee7ff 0, transparent 28%), var(--cream); font-family: 'Quicksand', sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center; text-align: center;
            overflow: hidden; touch-action: manipulation;
        }

        .floating-heart {
            position: absolute; color: var(--pink); pointer-events: none;
            animation: floatUp 1.5s ease-out forwards; z-index: 999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(1.5); opacity: 0; }
        }

        body::before, body::after { content: ''; position: fixed; border: 1px solid rgba(237,110,139,.18); border-radius: 50%; pointer-events: none; }
        body::before { width: 560px; height: 270px; transform: rotate(-25deg); top: -125px; right: -160px; } body::after { width: 520px; height: 250px; transform: rotate(42deg); bottom: -130px; left: -160px; }
        .glass-card { background: rgba(255,255,255,.68); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); padding: 56px 30px; border-radius: 32px; box-shadow: 0 24px 60px rgba(100,64,95,.14); border: 1px solid rgba(255,255,255,.9); width: 90%; max-width: 430px; animation: fadeIn 1.1s ease; position: relative; overflow:hidden; }

        .elegant-title { 
            font-family: 'Dancing Script', cursive; font-size: clamp(3.3rem, 13vw, 4.6rem);
            background: linear-gradient(110deg, #c95c79, #ed7891, #9a83be);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; 
        }

        .enter-btn { 
            background: linear-gradient(105deg, #e26c88, #af87ae); color: white; border: none; padding: 15px 34px;
            border-radius: 50px; font-size: 1rem; margin-top: 30px; cursor: pointer; box-shadow: 0 10px 20px rgba(198,92,122,.26); font-family: 'Quicksand', sans-serif;
            transition: 0.3s;
        }
        .enter-btn:active { transform: scale(0.95); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body onclick="spawnHeart(event)">

    <div class="glass-card">
        <h1 class="elegant-title">Hello, My Loveeeeee</h1>
        <p style="color: #666; font-size: 1.1rem; margin-top: 15px; line-height: 1.5;">
            Welcome to a little corner of the internet made just for you.
        </p>
        
        <button class="enter-btn" onclick="window.location.href='hub.html'">Enter Here</button>
    </div>

    <script>
        function spawnHeart(e) {
            if (e.target.tagName === 'BUTTON') return;
            const heart = document.createElement('div');
            heart.innerHTML = '❤️';
            heart.className = 'floating-heart';
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            heart.style.left = (x - 10) + 'px';
            heart.style.top = (y - 10) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 1500);
        }
    </script>
</body>
</html>
