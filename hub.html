<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Mandyyy</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #e56e8a; --cream: #fffafa; --ink: #412d46; --lilac: #9582b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; min-height: 100svh; height: auto; padding: 32px 0; background: radial-gradient(circle at 12% 15%, #ffe0e8 0, transparent 30%), radial-gradient(circle at 86% 90%, #ece6ff 0, transparent 30%), var(--cream); font-family: 'Quicksand', sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
        }
        
        body::before, body::after { content:''; position:fixed; border:1px solid rgba(229,110,138,.17); border-radius:50%; pointer-events:none; } body::before { width:600px; height:260px; top:-125px; left:-205px; transform:rotate(24deg); } body::after { width:580px; height:260px; bottom:-135px; right:-225px; transform:rotate(-29deg); }
        .glass-card { background: rgba(255,255,255,.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); padding: 44px 20px 24px; border-radius: 32px; box-shadow: 0 24px 60px rgba(100,64,95,.14); border: 1px solid rgba(255,255,255,.9); width: 90%; max-width: 445px; text-align: center; position:relative; }
        
        .elegant-title { font-family: 'Dancing Script', cursive; font-size: clamp(3.2rem, 13vw, 4.4rem); background: linear-gradient(110deg, #c95c79, #ed7891, #9a83be); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0; }
        
        .menu-container { display: grid; grid-template-columns: 1fr; gap: 11px; margin-top: 28px; }
        
        .menu-btn {
            background: rgba(255,255,255,.76); border: 1px solid rgba(229,110,138,.32); color: var(--ink); padding: 16px 18px; border-radius: 17px; font-size: .98rem; font-weight: 700; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease; text-decoration: none; display: block; font-family: 'Quicksand', sans-serif; box-shadow: 0 6px 15px rgba(98,62,96,.06);
        }
        .menu-btn:hover { transform: translateY(-2px); box-shadow:0 11px 21px rgba(98,62,96,.12); }.menu-btn:active { transform: scale(0.98); }

        /* Style for locked buttons */
        .menu-btn.locked {
            background: rgba(111,99,123,.08);
            border-color: rgba(111,99,123,.17);
            color: #827989;
            cursor: not-allowed;
            font-size: 1rem;
        }
        .menu-btn.locked:active { transform: scale(1); } /* Prevents the click animation */
    </style>
</head>
<body>

    <div class="glass-card">
        <h1 class="elegant-title">Our Memories</h1>
        <p style="color: #666; margin-top: 10px;">Select an event below, Mandyyy.</p>
        
        <div class="menu-container" id="menu-links">
            <a class="menu-btn" id="btn-val"></a>
            <a class="menu-btn" id="btn-month"></a>
            <a class="menu-btn" id="btn-bday"></a>
            <a class="menu-btn" id="btn-six-months"></a>
        </div>
    </div>

    <script>
        // Set up the events with their target dates, original text, and folder paths
        const events = [
            {
                id: 'btn-val',
                targetDate: Date.UTC(2026, 1, 13, 16, 0, 0), // Valentine's Date (Feb 14 PHT)
                unlockedText: "Valentine's Day 2026 ❤️",
                linkPath: "2026valentines/valentines2026.html"
            },
            {
                id: 'btn-month',
                targetDate: Date.UTC(2026, 2, 20, 16, 0, 0), // Monthiversary Date (Feb 21 PHT)
                unlockedText: "1st Monthiversary ✨",
                linkPath: "1stmonthiversary/1stmonthiversary.html"
            },
            {
                id: 'btn-bday',
                targetDate: Date.UTC(2026, 4, 5, 16, 0, 0), // Mandy's Birthday (May 6 PHT)
                unlockedText: "Happy Birthday Mandyyy! 🎂",
                linkPath: "mandy2026bday/bday.html"
            },
            {
                id: 'btn-six-months',
                // August 21, 2026 at 12:00 AM Philippine Time (UTC+8)
                targetDate: Date.UTC(2026, 7, 20, 16, 0, 0),
                unlockedText: "Six Months, One Little Universe 🌙",
                linkPath: "sixmonths2026/index.html"
            }
        ];

        function updateMenuTimers() {
            const now = new Date().getTime();

            events.forEach(event => {
                const btn = document.getElementById(event.id);
                if (!btn) return;

                const diff = event.targetDate - now;

                if (diff <= 0) {
                    // Time has passed: Unlock the button
                    btn.innerHTML = event.unlockedText;
                    btn.href = event.linkPath;
                    btn.classList.remove('locked');
                } else {
                    // Time has NOT passed: Lock the button and show countdown
                    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const s = Math.floor((diff % (1000 * 60)) / 1000);

                    // Formats time with leading zeros for single digits
                    const pad = (num) => num.toString().padStart(2, '0');

                    btn.innerHTML = `🔒 Unlocks in: ${d}d ${pad(h)}h ${pad(m)}m ${pad(s)}s`;
                    btn.removeAttribute('href'); // Removes the link so it can't be clicked
                    btn.classList.add('locked'); // Applies the gray CSS
                }
            });
        }

        // Run the timer every second
        setInterval(updateMenuTimers, 1000);
        updateMenuTimers(); // Run once immediately so it doesn't wait 1s to load
    </script>

</body>
</html>
